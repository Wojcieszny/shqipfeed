<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShqipFeed checks</title>
  <style>
    body {
      margin: 0;
      padding: 1.25rem;
      background: #f4efe6;
      color: #3e2c24;
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      line-height: 1.45;
    }
    main { max-width: 40rem; margin: 0 auto; }
    h1 { font-family: Georgia, serif; font-weight: 650; }
    ul { padding: 0; list-style: none; }
    li { margin: 0.45rem 0; padding: 0.7rem 0.8rem; border-radius: 0.7rem; background: #fffaf3; }
    .pass { box-shadow: inset 4px 0 0 #1f6f6a; }
    .fail { box-shadow: inset 4px 0 0 #c4654a; }
    .note { color: #6e5648; }
  </style>
</head>
<body>
  <main>
    <h1>ShqipFeed checks</h1>
    <p class="note">These checks do not verify Albanian accuracy or phone-specific audio.</p>
    <ul id="results"></ul>
  </main>
  <script src="rules.js"></script>
  <script src="data.js"></script>
  <script src="human.js"></script>
  <script src="sources.js"></script>
  <script src="day.js"></script>
  <script src="app.js"></script>
  <script>
    var results = document.getElementById("results");

    function add(ok, name, detail) {
      var li = document.createElement("li");
      li.className = ok ? "pass" : "fail";
      li.textContent = (ok ? "PASS" : "FAIL") + " — " + name + (detail ? " — " + detail : "");
      results.appendChild(li);
    }

    function stable(value) {
      if (Array.isArray(value)) return value.map(stable);
      if (value && typeof value === "object") {
        var out = {};
        Object.keys(value).sort().forEach(function (key) {
          out[key] = stable(value[key]);
        });
        return out;
      }
      return value;
    }

    function same(a, b) {
      return JSON.stringify(stable(a)) === JSON.stringify(stable(b));
    }

    function run() {
      var before = null;
      try {
        before = ShqipData.buildBackup();
      } catch (err) {
        before = null;
      }

      ShqipData.loadStarterCards().then(function (cards) {
        var required = ["id", "island", "english", "albanian", "verified"];
        var missing = [];
        cards.forEach(function (card, index) {
          required.forEach(function (field) {
            if (card[field] === undefined || card[field] === null || card[field] === "") {
              missing.push("card " + (index + 1) + " missing " + field);
            }
          });
          if (typeof card.verified !== "boolean") {
            missing.push("card " + (index + 1) + " verified is not true or false");
          }
        });
        add(cards.length > 0 && missing.length === 0, "cards.json loads and every card has id, island, english, albanian, verified", missing.join("; "));

        var ids = {};
        var dup = "";
        cards.forEach(function (card) {
          if (ids[card.id]) dup = card.id;
          ids[card.id] = true;
        });
        add(!dup, "all ids are unique", dup ? "duplicate " + dup : "");

        var missingField = ShqipData.validatePaste(JSON.stringify({
          id: "test-missing",
          island: "Brand New Island",
          english: "",
          albanian: "A",
          phonetic: "ah"
        }), [], []);
        var namesField = missingField.errors.join(" ");
        add(
          !missingField.ok && namesField.indexOf("test-missing") !== -1 && namesField.indexOf("english") !== -1,
          "pasted island validation rejects a missing field",
          namesField
        );

        var duplicate = ShqipData.validatePaste(JSON.stringify([
          { id: "greet-001", island: "Another Island", english: "Hi", albanian: "A", phonetic: "ah" }
        ]), ["greet-001"], ["Greetings & Check-ins"]);
        var dupText = duplicate.errors.join(" ");
        add(
          !duplicate.ok && dupText.indexOf("already used") !== -1,
          "pasted island validation rejects a duplicate id",
          dupText
        );

        ShqipApp.setCardStatus("progress-test", "known");
        var reloaded = ShqipApp.getProgress();
        add(reloaded["progress-test"] === "known", "progress saves and reloads", JSON.stringify(reloaded["progress-test"] || null));

        ShqipApp.setCardStatus("greet-001", "skipped");
        ShqipData.setVerified("greet-001", true);
        ShqipData.addOwnerCards([{
          id: "export-test-001",
          island: "Export Test Island",
          english: "Hello",
          albanian: "Përshëndetje",
          phonetic: "puhr-shuhn-DET-yeh",
          tip: "",
          blocks: [],
          verified: false
        }]);
        var exported = JSON.parse(JSON.stringify(ShqipData.buildBackup()));
        ShqipData.applyBackup(before);
        ShqipApp.setCardStatus("greet-001", "known");
        var imported = ShqipData.applyBackup(exported);
        var after = ShqipData.buildBackup();
        add(imported.ok && same(exported, after), "export then import gives the same data", imported.ok ? "" : imported.errors.join(" "));
      }).catch(function (err) {
        add(false, "cards.json loads", String(err && err.message ? err.message : err));
      }).then(function () {
        if (before) ShqipData.applyBackup(before);
      });
    }

    // SETUP-01 checks: source JSON, sw.js files, audio files, human coverage.
    function exists(url, retry) {
      return fetch(url, { method: "HEAD", cache: "no-store" }).then(function (r) {
        return r.ok;
      }).catch(function () {
        // a dropped connection is not a missing file: try once more
        return retry === false ? false : exists(url, false);
      });
    }

    function checkAll(urls) {
      var missing = [];
      var pos = 0;
      function worker() {
        if (pos >= urls.length) return Promise.resolve();
        var u = urls[pos++];
        return exists(u).then(function (ok) {
          if (!ok) missing.push(u);
          return worker();
        });
      }
      var pool = [];
      for (var i = 0; i < 3; i++) pool.push(worker());
      return Promise.all(pool).then(function () { return missing; });
    }

    function listMissing(list) {
      return list.length + " missing: " + list.slice(0, 20).join(", ") + (list.length > 20 ? " ..." : "");
    }

    function runSetupChecks() {
      fetch("cards.json", { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (cards) {
        var bad = [];
        var seen = {};
        var dups = [];
        cards.forEach(function (c) {
          ["id", "island", "english", "albanian", "verified"].forEach(function (f) {
            if (c[f] === undefined || c[f] === null || c[f] === "") bad.push((c.id || "?") + " missing " + f);
          });
          if (c.verified !== false) bad.push((c.id || "?") + " verified is not false");
          if (seen[c.id]) dups.push(c.id);
          seen[c.id] = true;
        });
        add(cards.length > 0 && bad.length === 0, "source cards.json: required fields and verified === false",
          bad.length ? listMissing(bad) : cards.length + " cards");
        add(dups.length === 0, "source cards.json: ids unique", dups.join(", "));

        var audio = {};
        cards.forEach(function (c) {
          audio["audio/" + (c.audio || c.id) + ".mp3"] = true;
          var l = c.lesson;
          if (l) {
            (l.answers || []).forEach(function (a) { if (a.audio) audio["audio/" + a.audio + ".mp3"] = true; });
            if (l.reply && l.reply.audio) audio["audio/" + l.reply.audio + ".mp3"] = true;
          }
        });
        var audioList = Object.keys(audio);
        checkAll(audioList).then(function (missing) {
          add(missing.length === 0, "card, answer and reply audio files exist (" + audioList.length + " checked)",
            missing.length ? listMissing(missing) : "");
        });

        var human = window.ShqipHuman || {};
        function key(t) { return String(t).toLowerCase().replace(/[.,!?;:"]/g, "").trim(); }
        var cardHuman = 0;
        var words = {};
        var wordHuman = {};
        cards.forEach(function (c) {
          if (human[key(c.albanian)]) cardHuman++;
          (c.blocks || []).forEach(function (b) {
            var k = key(b.text);
            words[k] = true;
            if (human[k]) wordHuman[k] = true;
          });
        });
        var wordTotal = Object.keys(words).length;
        var wordH = Object.keys(wordHuman).length;
        add(true, "INFO human audio coverage (informational)",
          "cards: " + cardHuman + "/" + cards.length + " human, " + (cards.length - cardHuman) + " synthetic TTS; " +
          "words: " + wordH + "/" + wordTotal + " human, " + (wordTotal - wordH) + " synthetic TTS");
      }).catch(function (err) {
        add(false, "source cards.json checks", String(err && err.message ? err.message : err));
      });

      fetch("sw.js", { cache: "no-store" }).then(function (r) { return r.text(); }).then(function (text) {
        var block = text.split("const ASSETS = [")[1] || "";
        block = block.split("];")[0];
        var files = [];
        block.replace(/"\.\/([^"]+)"/g, function (m, f) { files.push(f); return m; });
        return checkAll(files.map(encodeURI)).then(function (missing) {
          add(files.length > 0 && files.length < 1500 && missing.length === 0, "sw.js caches fewer than 1500 files and 100% exist (" + files.length + " checked)",
            missing.length ? listMissing(missing.map(decodeURI)) : files.length + " files cached");
        });
      }).catch(function (err) {
        add(false, "sw.js file list", String(err && err.message ? err.message : err));
      });
    }

    runSetupChecks();

    // HUMAN-AUDIO-01: human.js loads and every file it references exists.
    function runHumanChecks() {
      var human = window.ShqipHuman;
      if (!human || typeof human !== "object") {
        add(false, "human.js loads", "window.ShqipHuman is missing");
        return;
      }
      var keys = Object.keys(human);
      var files = {};
      keys.forEach(function (k) {
        var f = human[k].file || ("audio/human/" + k + ".mp3");
        files[f] = true;
      });
      var list = Object.keys(files);
      add(keys.length > 0, "human.js loads", keys.length + " entries");
      checkAll(list.map(encodeURI)).then(function (missing) {
        add(missing.length === 0, "every file referenced in human.js exists (" + list.length + " checked)",
          missing.length ? listMissing(missing.map(decodeURI)) : "");
      });
    }

    runHumanChecks();

    // ALIGN-CARDS-01: phonetics everywhere, and every clip in use is a registered human recording.
    function runAlignChecks() {
      fetch("cards.json", { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (cards) {
        var noPhon = cards.filter(function (c) {
          return typeof c.phonetic !== "string" || !c.phonetic.trim();
        }).map(function (c) { return c.id; });
        add(noPhon.length === 0, "every card has a non-empty phonetic", noPhon.length ? listMissing(noPhon) : cards.length + " cards");

        var used = {};
        cards.forEach(function (c) {
          used["audio/" + (c.audio || c.id) + ".mp3"] = c.id;
          var l = c.lesson;
          if (l) {
            (l.answers || []).forEach(function (a) { if (a.audio) used["audio/" + a.audio + ".mp3"] = a.id; });
            if (l.reply && l.reply.audio) used["audio/" + l.reply.audio + ".mp3"] = l.reply.id;
          }
        });
        var day = window.ShqipDay || { turns: [] };
        (day.turns || []).forEach(function (t, i) {
          if (t.audio) used["audio/" + t.audio + ".mp3"] = "day turn " + (i + 1);
        });
        var reg = (window.ShqipSources && window.ShqipSources.cardAudio) || {};
        var human = { commons: 1, loecsen: 1, "50languages": 1 };
        var bad = Object.keys(used).filter(function (p) {
          var e = reg[p];
          return !e || !human[e.source] || !e.speaker || !e.license || !e.from;
        });
        add(Object.keys(used).length > 0 && bad.length === 0,
          "every clip used by cards.json and day.js is a registered human recording (" + Object.keys(used).length + " clips, 0 synthetic allowed)",
          bad.length ? listMissing(bad) : "");
        var regFiles = Object.keys(reg);
        checkAll(regFiles.map(encodeURI)).then(function (missing) {
          add(regFiles.length > 0 && missing.length === 0, "every file listed in sources.js exists (" + regFiles.length + " checked)",
            missing.length ? listMissing(missing.map(decodeURI)) : "");
        });
      }).catch(function (err) {
        add(false, "ALIGN-CARDS-01 checks", String(err && err.message ? err.message : err));
      });
    }

    runAlignChecks();

    function runCommuteChecks() {
      fetch("app.js", { cache: "no-store" }).then(function (r) { return r.text(); }).then(function (code) {
        var hasSynth = code.indexOf("speechSynthesis") !== -1 || code.indexOf("SpeechSynthesisUtterance") !== -1;
        add(!hasSynth, "app.js contains zero references to window.speechSynthesis or SpeechSynthesisUtterance (100% human audio only)", hasSynth ? "found speechSynthesis reference" : "");
      }).catch(function (err) {
        add(false, "app.js human audio check", String(err));
      });

      try {
        var order = typeof ShqipData.getCurriculumOrder === "function" ? ShqipData.getCurriculumOrder() : [];
        var expectedFirst6 = [
          "Greetings & Check-ins",
          "Conversation Repair",
          "Coffee & Table",
          "Lego Verb Builder",
          "Food & Eating",
          "Family & Warmth"
        ];
        var orderOk = Array.isArray(order) && expectedFirst6.every(function (name, idx) {
          return order[idx] === name;
        });
        add(orderOk, "ShqipData.getCurriculumOrder() returns the ordered beginner Island path", order.slice(0, 6).join(" -> "));
      } catch (err) {
        add(false, "ShqipData.getCurriculumOrder() returns the ordered beginner Island path", String(err));
      }

      ShqipData.loadStarterCards().then(function () {
        var backupBefore = null;
        try {
          backupBefore = ShqipData.buildBackup();
        } catch (err) {
          backupBefore = null;
        }
        try {
          var session = typeof ShqipData.buildInterleavedSession === "function"
            ? ShqipData.buildInterleavedSession("Food & Eating")
            : null;
          var steps = Array.isArray(session) ? session : (session && Array.isArray(session.steps) ? session.steps : []);
          var teachSteps = steps.filter(function (s) { return s && s.type === "teach"; });
          var checkSteps = steps.filter(function (s) { return s && s.type === "check"; });
          var maxConsecutiveTeach = 0;
          var curTeach = 0;
          steps.forEach(function (s) {
            if (s && s.type === "teach") {
              curTeach += 1;
              if (curTeach > maxConsecutiveTeach) maxConsecutiveTeach = curTeach;
            } else if (s && s.type === "check") {
              curTeach = 0;
            }
          });
          var checkedIds = {};
          var hardcodedGreetDistractor = false;
          checkSteps.forEach(function (s) {
            var cid = s.cardId || (s.card && s.card.id) || (s.quiz && s.quiz.cardId);
            if (cid) checkedIds[cid] = true;
            var choices = (s.quiz && s.quiz.choices) || [];
            choices.forEach(function (ch) {
              if (ch && (ch.audio === "greet-001" || ch.audio === "greet-002")) {
                hardcodedGreetDistractor = true;
              }
            });
          });
          var allTaughtTested = teachSteps.length > 0 && teachSteps.every(function (t) {
            var c = t.card;
            if (!c || (c.lesson && c.lesson.kind === "count") || c.review === false) return true;
            return checkedIds[c.id] === true;
          });
          var interleaveOk = teachSteps.length > 0 &&
            checkSteps.length > 0 &&
            maxConsecutiveTeach <= 3 &&
            allTaughtTested &&
            !hardcodedGreetDistractor;
          add(
            interleaveOk,
            "ShqipData.buildInterleavedSession() returns interleaved teach and check steps every 2–3 cards and tests every new card",
            "teach=" + teachSteps.length + ", check=" + checkSteps.length + ", maxTeachRun=" + maxConsecutiveTeach
          );
        } catch (err) {
          add(false, "ShqipData.buildInterleavedSession() returns interleaved teach and check steps every 2–3 cards and tests every new card", String(err));
        }

        try {
          var sampleDataUrl = "data:audio/webm;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEA";
          ShqipData.setCustomAudio("greet-001", sampleDataUrl);
          var loadedAudio = ShqipData.getCustomAudio("greet-001");
          var backupWithAudio = JSON.parse(JSON.stringify(ShqipData.buildBackup()));
          ShqipData.clearCustomAudio("greet-001");
          var clearedAudio = ShqipData.getCustomAudio("greet-001");
          var importRes = ShqipData.applyBackup(backupWithAudio);
          var restoredAudio = ShqipData.getCustomAudio("greet-001");
          ShqipData.clearCustomAudio("greet-001");
          var audioHelpersOk = loadedAudio === sampleDataUrl &&
            !clearedAudio &&
            importRes && importRes.ok &&
            restoredAudio === sampleDataUrl;
          add(
            audioHelpersOk,
            "ShqipData custom family audio helpers (setCustomAudio, getCustomAudio, clearCustomAudio) save, load, and export/import in backup JSON",
            audioHelpersOk ? "" : "failed custom audio roundtrip"
          );
        } catch (err) {
          add(false, "ShqipData custom family audio helpers (setCustomAudio, getCustomAudio, clearCustomAudio) save, load, and export/import in backup JSON", String(err));
        } finally {
          if (backupBefore) ShqipData.applyBackup(backupBefore);
        }
      });
    }

        runCommuteChecks();

    // CORPUS-SCENES-01: 10 Real-Life Family Scenes in day.js & everyday cards expansion
    function runCorpusScenesChecks() {
      var day = window.ShqipDay || {};
      var scenes = Array.isArray(day.scenes) ? day.scenes : [];
      var turns = Array.isArray(day.turns) ? day.turns : [];

      var distinctScenes = {};
      if (scenes.length > 0) {
        scenes.forEach(function (s) { if (s && (s.id || s.title)) distinctScenes[s.id || s.title] = true; });
      } else {
        turns.forEach(function (t) { if (t && (t.sceneId || t.part)) distinctScenes[t.sceneId || t.part] = true; });
      }
      var sceneCount = Object.keys(distinctScenes).length;
      var badTurns = [];
      var dayAudioUrls = [];
      var reg = (window.ShqipSources && window.ShqipSources.cardAudio) || {};

      turns.forEach(function (t, idx) {
        var missingFields = [];
        if (!t.who) missingFields.push('who');
        if (!t.sq) missingFields.push('sq');
        if (!t.en) missingFields.push('en');
        if (!t.audio) missingFields.push('audio');
        if (!t.part) missingFields.push('part');
        if (missingFields.length > 0) {
          badTurns.push('turn ' + (idx + 1) + ' missing ' + missingFields.join(', '));
        }
        if (t.audio) {
          var audioPath = 'audio/' + t.audio + '.mp3';
          dayAudioUrls.push(audioPath);
          if (!reg[audioPath]) {
            badTurns.push('turn ' + (idx + 1) + ' audio not in sources.js: ' + audioPath);
          }
        }
      });

      add(
        sceneCount >= 8 && badTurns.length === 0 && turns.length > 0,
        'ShqipDay contains >= 8 distinct real-life scenes, all turns have who/sq/en/audio/part, and audio registered in sources.js (' + sceneCount + ' scenes, ' + turns.length + ' turns)',
        badTurns.length ? listMissing(badTurns) : sceneCount + ' scenes, ' + turns.length + ' turns'
      );

      checkAll(dayAudioUrls.map(encodeURI)).then(function (missingAudio) {
        add(
          dayAudioUrls.length > 0 && missingAudio.length === 0,
          '100% of ShqipDay turn audio files exist on disk (' + dayAudioUrls.length + ' checked)',
          missingAudio.length ? listMissing(missingAudio.map(decodeURI)) : ''
        );
      });

      fetch('cards.json', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (cards) {
        var badCards = [];
        cards.forEach(function (c) {
          if (c.verified !== false) {
            badCards.push(c.id + ' verified is not false');
          }
          if (typeof c.phonetic !== 'string' || !c.phonetic.trim()) {
            badCards.push(c.id + ' missing phonetic');
          }
          if (!Array.isArray(c.blocks) || c.blocks.length === 0) {
            badCards.push(c.id + ' invalid or empty blocks');
          } else {
            c.blocks.forEach(function (b, bIdx) {
              if (!b.text || !b.type) badCards.push(c.id + ' block ' + (bIdx + 1) + ' missing text/type');
            });
          }
          var audioFile = 'audio/' + (c.audio || c.id) + '.mp3';
          if (!reg[audioFile]) {
            badCards.push(c.id + ' audio not registered in sources.js: ' + audioFile);
          }
        });

        add(
          cards.length >= 280 && badCards.length === 0,
          'all cards in cards.json have verified === false, non-empty phonetic, valid blocks, and registered audio (' + cards.length + ' cards)',
          badCards.length ? listMissing(badCards) : cards.length + ' cards verified'
        );
      }).catch(function (err) {
        add(false, 'CORPUS-SCENES-01 cards check', String(err && err.message ? err.message : err));
      });
    }

    runCorpusScenesChecks();

    // MASTER-RECONCILE-01: Strict Anti-Duplication, Scene Variety, and SIMPLIFY-LOGIC-01 Checks
    function hashBuffer(buf) {
      var bytes = new Uint8Array(buf);
      var h1 = 0x811c9dc5;
      var h2 = 5381;
      for (var i = 0; i < bytes.length; i++) {
        h1 ^= bytes[i];
        h1 = Math.imul(h1, 0x01000193) >>> 0;
        h2 = ((h2 << 5) + h2 + bytes[i]) >>> 0;
      }
      return bytes.length + ':' + h1.toString(16) + ':' + h2.toString(16);
    }

    function fetchHashes(urls) {
      var map = {};
      var unique = [];
      var seen = {};
      urls.forEach(function (u) {
        if (u && !seen[u]) {
          seen[u] = true;
          unique.push(u);
        }
      });
      var pos = 0;
      function worker() {
        if (pos >= unique.length) return Promise.resolve();
        var u = unique[pos++];
        return fetch(encodeURI(u), { cache: 'no-store' }).then(function (r) {
          if (!r.ok) return null;
          return r.arrayBuffer();
        }).then(function (buf) {
          if (buf) map[u] = hashBuffer(buf);
          return worker();
        }).catch(function () {
          return worker();
        });
      }
      var pool = [];
      for (var i = 0; i < 4; i++) pool.push(worker());
      return Promise.all(pool).then(function () { return map; });
    }

    function normCheckText(s) {
      return String(s || '').toLowerCase().replace(/[«»"'“”.,!?¿;:()]/g, '').replace(/\s+/g, ' ').trim();
    }

    function runMasterReconcileChecks() {
      // 1 & 2 & 3: Unique primary card sentences/MP3s, exchange deduplication, and day.js turn variety
      fetch('cards.json', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (cards) {
        var seenSq = {};
        var dupSq = [];
        var cardAudioUrls = [];
        var exAudioUrls = [];

        cards.forEach(function (c) {
          var sq = normCheckText(c.albanian);
          if (seenSq[sq]) {
            dupSq.push(seenSq[sq] + ' & ' + c.id + ' (' + c.albanian + ')');
          } else {
            seenSq[sq] = c.id;
          }
          var pUrl = 'audio/' + (c.audio || c.id) + '.mp3';
          cardAudioUrls.push(pUrl);

          var l = c.lesson || {};
          (l.answers || []).forEach(function (a) {
            if (a && a.audio) exAudioUrls.push('audio/' + a.audio + '.mp3');
          });
          if (l.reply && l.reply.audio) {
            exAudioUrls.push('audio/' + l.reply.audio + '.mp3');
          }
        });

        var day = window.ShqipDay || {};
        var turns = Array.isArray(day.turns) ? day.turns : [];
        var scenes = Array.isArray(day.scenes) ? day.scenes : [];
        var dayUrls = turns.map(function (t) { return 'audio/' + t.audio + '.mp3'; });

        return fetchHashes(cardAudioUrls.concat(exAudioUrls).concat(dayUrls)).then(function (hashes) {
          // Check 1: Unique Primary Card Sentences & Primary MP3s
          var seenCardHash = {};
          var dupCardHash = [];
          cards.forEach(function (c) {
            var pUrl = 'audio/' + (c.audio || c.id) + '.mp3';
            var h = hashes[pUrl];
            if (!h) {
              dupCardHash.push(c.id + ' missing hash');
            } else if (seenCardHash[h]) {
              dupCardHash.push(seenCardHash[h] + ' & ' + c.id);
            } else {
              seenCardHash[h] = c.id;
            }
          });
          add(
            dupSq.length === 0 && dupCardHash.length === 0,
            'MASTER-RECONCILE-01: unique primary card sentences and unique primary .mp3 files across cards.json (' + cards.length + ' cards)',
            dupSq.concat(dupCardHash).slice(0, 10).join('; ')
          );

          // Check 2: No Consecutive Identical Turns in day.js
          var consecErrors = [];
          for (var i = 1; i < turns.length; i++) {
            var prev = turns[i - 1];
            var curr = turns[i];
            var prevSq = normCheckText(prev.sq);
            var currSq = normCheckText(curr.sq);
            var prevH = hashes['audio/' + prev.audio + '.mp3'];
            var currH = hashes['audio/' + curr.audio + '.mp3'];
            if (prevSq === currSq) {
              consecErrors.push('turns ' + i + ' & ' + (i + 1) + ' identical sq: ' + curr.sq);
            } else if (prevH && currH && prevH === currH) {
              consecErrors.push('turns ' + i + ' & ' + (i + 1) + ' byte-identical audio: ' + prev.audio + ' & ' + curr.audio);
            }
          }
          add(
            turns.length >= 80 && consecErrors.length === 0,
            'MASTER-RECONCILE-01: zero consecutive identical turns (text or audio bytes) in day.js (' + turns.length + ' turns)',
            consecErrors.join('; ')
          );

          // Check 3: Scene & Exchange Variety
          var sceneErrors = [];
          if (scenes.length < 10) {
            sceneErrors.push('expected 10 scenes, got ' + scenes.length);
          }
          scenes.forEach(function (sc) {
            var sTurns = sc.turns || [];
            if (sTurns.length < 8 || sTurns.length > 12) {
              sceneErrors.push(sc.id + ' has ' + sTurns.length + ' turns');
            }
            var seenInSceneSq = {};
            var seenInSceneHash = {};
            sTurns.forEach(function (t, idx) {
              var sq = normCheckText(t.sq);
              var h = hashes['audio/' + t.audio + '.mp3'];
              if (seenInSceneSq[sq]) {
                sceneErrors.push(sc.id + ' repeats sq "' + t.sq + '"');
              }
              seenInSceneSq[sq] = true;
              if (h && seenInSceneHash[h]) {
                sceneErrors.push(sc.id + ' repeats audio file in turn ' + (idx + 1));
              }
              if (h) seenInSceneHash[h] = true;
            });
          });

          // Check that exchange files on disk are deduplicated (no cloned -a1/-a2/-r byte-duplicates)
          var uniqueExUrls = {};
          exAudioUrls.forEach(function (u) { uniqueExUrls[u] = true; });
          var exUrlList = Object.keys(uniqueExUrls);
          var seenExFileHash = {};
          var dupExFiles = [];
          exUrlList.forEach(function (u) {
            var h = hashes[u];
            if (!h) return;
            if (seenExFileHash[h] && seenExFileHash[h] !== u) {
              dupExFiles.push(u + ' == ' + seenExFileHash[h]);
            } else {
              seenExFileHash[h] = u;
            }
          });

          add(
            sceneErrors.length === 0 && dupExFiles.length === 0,
            'MASTER-RECONCILE-01: all 10 scenes have distinct turns within each scene and exchange audio pointers have zero cloned duplicate MP3 files on disk',
            sceneErrors.concat(dupExFiles).slice(0, 10).join('; ')
          );
        });
      }).catch(function (err) {
        add(false, 'MASTER-RECONCILE-01 audio/card uniqueness checks', String(err && err.message ? err.message : err));
      });

      // 4: Layout & Logic Checks (SIMPLIFY-LOGIC-01)
      ShqipData.loadStarterCards().then(function (cards) {
        var backupBefore = null;
        try { backupBefore = ShqipData.buildBackup(); } catch (e) { backupBefore = null; }
        try {
          var sampleCard = cards.find(function (c) {
            return c.blocks && c.blocks.length >= 2 && c.lesson && c.lesson.facts && c.lesson.facts.length > 0;
          }) || cards[0];

          // Render unseen card (Box 0)
          ShqipData.resetProgress();
          var unseenEl = typeof ShqipApp.renderCard === 'function'
            ? ShqipApp.renderCard(sampleCard, {}, 0, 10)
            : null;
          var noWordTable = unseenEl ? !unseenEl.querySelector('table.word-table') : false;
          var hasBlockSq = unseenEl ? !!unseenEl.querySelector('.block .block-sq') : false;
          var hasBlockEn = unseenEl ? !!unseenEl.querySelector('.block .block-en') : false;
          var unseenNotRecallWait = unseenEl ? !unseenEl.classList.contains('is-recall-wait') : false;

          // Box 1 card (failed/fresh review): must show Albanian immediately and NOT wait in recall-wait
          ShqipData.gradeCard(sampleCard.id, false);
          var box1El = typeof ShqipApp.renderCard === 'function'
            ? ShqipApp.renderCard(sampleCard, {}, 0, 10)
            : null;
          var box1NotRecallWait = box1El ? !box1El.classList.contains('is-recall-wait') : false;

          // Box 2+ card (mastered review): must start in recall-first wait (.is-recall-wait)
          ShqipData.gradeCard(sampleCard.id, true); // advances Box 1 -> Box 2
          var reviewEl = typeof ShqipApp.renderCard === 'function'
            ? ShqipApp.renderCard(sampleCard, {}, 0, 10)
            : null;
          var reviewStartsRecallWait = reviewEl ? reviewEl.classList.contains('is-recall-wait') : false;

          // Check block-build micro-check support and fallback handling
          var bbQuiz = typeof ShqipData.makeQuizForCard === 'function'
            ? ShqipData.makeQuizForCard(sampleCard, 'block-build')
            : null;
          var bbQuizOk = bbQuiz && bbQuiz.mode === 'block-build' && Array.isArray(bbQuiz.choices) && bbQuiz.choices.length >= 2;
          var bbCheckEl = (bbQuizOk && typeof ShqipApp.renderCheck === 'function')
            ? ShqipApp.renderCheck({ type: 'check', card: sampleCard, cardId: sampleCard.id, mode: 'block-build', quiz: bbQuiz })
            : null;
          var bbRenderOk = bbCheckEl ? bbCheckEl.querySelectorAll('[data-action="check-pick"]').length >= 2 : false;

          // Check 1-block card fallback in makeQuizForCard
          var singleBlockCard = { id: 'single-test', albanian: 'Po', english: 'Yes', blocks: [{ text: 'Po', type: 'power' }] };
          var singleQuiz = typeof ShqipData.makeQuizForCard === 'function'
            ? ShqipData.makeQuizForCard(singleBlockCard, 'block-build')
            : null;
          var singleFallbackOk = singleQuiz && singleQuiz.mode === 'meaning' && singleQuiz.fellBack === 'meaning';

          var layoutLogicOk = noWordTable && hasBlockSq && hasBlockEn && unseenNotRecallWait && box1NotRecallWait && reviewStartsRecallWait && bbQuizOk && bbRenderOk && singleFallbackOk;
          add(
            layoutLogicOk,
            'MASTER-RECONCILE-01: renderCard() removes table.word-table, renders inline .block-sq/.block-en glosses, starts Box 2+ cards in .is-recall-wait, and supports "block-build" micro-checks with fallback',
            layoutLogicOk ? '' : 'noWordTable=' + noWordTable + ', blockSq=' + hasBlockSq + ', blockEn=' + hasBlockEn + ', box1=' + box1NotRecallWait + ', box2=' + reviewStartsRecallWait + ', blockBuild=' + (bbQuizOk && bbRenderOk) + ', fallback=' + singleFallbackOk
          );
        } catch (err) {
          add(false, 'MASTER-RECONCILE-01: layout and logic checks', String(err && err.message ? err.message : err));
        } finally {
          if (backupBefore) ShqipData.applyBackup(backupBefore);
        }
      });
    }

    runMasterReconcileChecks();

    run();
  </script>
</body>
</html>
